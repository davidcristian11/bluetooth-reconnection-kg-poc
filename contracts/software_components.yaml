contractVersion: "1.0"

dataset:
  name: software_components
  entity: SoftwareComponent
  path: data/nodes/software_components.csv
  format: csv
  delimiter: ","
  encoding: utf-8
  headerRequired: true
  additionalColumnsAllowed: false

primaryKey:
  - id

columns:
  id:
    type: string
    required: true
    unique: true
    pattern: "^COMP-[0-9]{3}$"

  name:
    type: string
    required: true
    minimumLength: 1

  description:
    type: string
    required: true
    minimumLength: 1

  version:
    type: string
    required: true
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"

  sourceSystem:
    type: string
    required: true
    allowedValues:
      - SoftwareArchitectureSystem

crossDatasetRules:
  - name: component_implements_requirement
    description: >
      Every SoftwareComponent must implement at least one Requirement
      through IMPLEMENTS.